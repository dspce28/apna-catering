*{box-sizing:border-box;margin:0;padding:0}

.script{font-family:'Pinyon Script',cursive;font-weight:400;line-height:1}
.caps{font-family:'Playfair Display',serif;font-weight:400;text-transform:uppercase;letter-spacing:.02em;line-height:1.02}
.divider{display:flex;align-items:center;justify-content:center;gap:2.2mm;margin:3mm auto}
.divider i{display:block;width:9mm;height:.25mm}
.divider b{display:block;width:1.4mm;height:1.4mm;border-radius:50%}
.tonal{position:absolute;inset:0;width:100%;height:100%}
.replace{position:absolute;left:1.5mm;bottom:1.5mm;background:#E0245E;color:#fff;font:600 5.5pt Montserrat;padding:.6mm 1.2mm;letter-spacing:.04em;z-index:5}

@page{size:200mm 246mm;margin:0}
.sheet{position:relative;width:200mm;height:246mm;overflow:hidden;break-after:page;background:#5A2160}
.sheet.preview{background:#ece6df;height:272mm}
.paper{position:absolute;background:#5A2160;overflow:hidden}
.face{position:absolute;left:19mm;top:51mm;width:162mm;height:114mm}
.pz{position:absolute}
.pz.big{width:42mm;right:6mm;top:8mm;transform:rotate(14deg)}
.pz.small{width:16mm;right:46mm;top:62mm;transform:rotate(-24deg);opacity:.75}
.to{position:absolute;left:14mm;top:44mm;width:84mm}
.to .script{font-size:20pt;color:#F1DFBA}
.to .line{height:.25mm;background:#D6B06A;margin-top:12mm;opacity:.8}
.mark{position:absolute;left:14mm;bottom:9mm;font-size:5.6pt;letter-spacing:.34em;color:#D6B06A}
/* flaps are printed rotated 180deg on the net so they read upright once folded to the back */
.flapart{position:absolute;left:19mm;top:3mm;width:162mm;height:48mm}
.seal{position:absolute;left:50%;top:6mm;width:22mm;height:22mm;margin-left:-11mm;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F6E3A8,#D6B06A 55%,#9A7434);display:grid;place-items:center;box-shadow:0 0 0 .6mm #5A2160,0 0 0 .9mm #D6B06A}
.seal img{width:18mm}
.pocketart{position:absolute;left:19mm;top:165mm;width:162mm;height:78mm}
.pocketart .script{position:absolute;left:0;right:0;top:30mm;text-align:center;font-size:15pt;color:#D6B06A}
.rot{transform:rotate(180deg)}
.die{position:absolute;inset:0;width:100%;height:100%}
.preview .card{position:absolute;width:162mm;height:114mm;background:#5A2160;overflow:hidden;box-shadow:0 1.5mm 4mm rgba(0,0,0,.25)}
.preview .lbl{position:absolute;font-size:7pt;letter-spacing:.2em;text-transform:uppercase;color:#6a5670}
