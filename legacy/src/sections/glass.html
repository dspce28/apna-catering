<!-- INDOOR / OUTDOOR: wipe the fogged glass to look inside -->
<section class="glass" id="venues" aria-label="Indoor and outdoor catering">
  <div class="glass-stage" data-glass>
    <img class="glass-img on" data-kind="indoor" src="img/gw-buffet-2400.webp" alt="A palace ballroom buffet with silver chafing dishes and red roses">
    <img class="glass-img" data-kind="outdoor" src="img/gw-mandap-2400.webp" alt="An outdoor marigold mandap at dusk with diyas and fairy lights" loading="lazy">
    <canvas class="glass-fog" aria-hidden="true"></canvas>
    <p class="glass-word" aria-hidden="true"><span data-word="indoor">Step inside</span><span data-word="outdoor">Under the stars</span></p>
    <div class="glass-copy">
      <p class="eyebrow center">Indoor &amp; outdoor catering</p>
      <div class="glass-toggle" role="tablist" aria-label="Venue type">
        <button role="tab" aria-selected="true" data-kind="indoor">Indoors</button>
        <button role="tab" aria-selected="false" data-kind="outdoor">Outdoors</button>
      </div>
      <p class="glass-text" data-text="indoor">Banquet halls, hotels and Gurdwara halls across Scotland, dressed and served by our own team.</p>
      <p class="glass-text" data-text="outdoor" hidden>Marquees, gardens and country houses, with field kitchens, live grills and full service under canvas.</p>
    </div>
    <p class="glass-hint"><span aria-hidden="true">✦</span> Wipe the glass to look inside</p>
  </div>
</section>
